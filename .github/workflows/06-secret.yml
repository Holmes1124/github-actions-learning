name: 06 Use Secret

on:
  workflow_dispatch:

jobs:
  check-secret:
    runs-on: ubuntu-latest

    steps:
      - name: 检查 Secret 是否注入
        env:
          LEARNING_TOKEN: ${{ secrets.LEARNING_TOKEN }}
        run: |
          if [ -n "$LEARNING_TOKEN" ]; then
            echo "Secret 已成功注入"
          else
            echo "没有读取到 Secret"
            exit 1
          fi
